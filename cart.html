<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | Aura Print &amp; Promo</title>
<meta name="description" content="Your Aura Print cart. Prices include GST and free delivery Australia wide.">
<meta name="robots" content="noindex,follow">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/aura.css?v=20260831b">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="mask-icon" href="assets/aura-mark-black.svg" color="#EC4899">
<style>
.cartgrid{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
@media(max-width:900px){.cartgrid{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:1fr auto;gap:18px;padding:20px 0;border-bottom:1px solid #ece6de}
.line:last-of-type{border-bottom:none}
.line h3{font-size:17px;font-family:'Inter',sans-serif;font-weight:700;letter-spacing:0}
.line .spec{color:#6f6960;font-size:14px;margin-top:4px}
.line .qty{font-family:'Inter',sans-serif;font-size:13.5px;color:#6f6960;margin-top:8px}
.line .rm{background:none;border:none;color:#948d83;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-top:10px}
.line .rm:hover{color:#a8342b}
.line .amt{text-align:right;font-weight:700;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.line .amt small{display:block;font-size:11.5px;color:#948d83;font-weight:500;margin-top:3px}
.sumrow{display:flex;justify-content:space-between;padding:9px 0;font-size:15px;color:#6f6960}
.sumrow b{color:#0F0F10;font-variant-numeric:tabular-nums}
.sumrow.tot{border-top:1px solid #ece6de;margin-top:8px;padding-top:15px;font-size:17px;color:#0F0F10;font-weight:700}
.sumrow.tot b{font-family:'Archivo Black',sans-serif;font-size:26px}
.freebadge{display:inline-flex;align-items:center;gap:7px;background:#e4f2ea;color:#1f7a4c;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;margin-top:6px}
.trust{margin-top:20px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:#6f6960}
.trust div{display:flex;gap:9px;align-items:flex-start}
.trust span{color:#1f7a4c;font-weight:700;flex:none}
.emptycart{text-align:center;padding:50px 20px}
.emptycart h2{font-size:26px;margin-bottom:10px}
.emptycart p{color:#6f6960;max-width:44ch;margin:0 auto 24px}
</style>
</head>
<body>

<div class="page-hero">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / <b style="color:#fff">Cart</b></div>
    <h1>YOUR <span class="grad-text">CART</span></h1>
    <p>Everything below includes GST and free delivery Australia wide.</p>
  </div>
</div>

<section class="pad">
  <div class="wrap">
    <div id="cartWrap"></div>
  </div>
</section>

<script src="assets/config.js?v=20260831d"></script>
<script src="assets/aura-cart.js?v=20260825c"></script>
<script>
(function(){
  var C = window.AuraCart, wrap = document.getElementById('cartWrap');

  function render(){
    var list = C.items();

    if(!list.length){
      wrap.innerHTML =
        '<div class="panel emptycart">' +
          '<h2>Nothing in your cart yet</h2>' +
          '<p>Pick a product, choose your options and add it here. ' +
            'Business cards, flyers, brochures and corflute signs can be paid for online right now.</p>' +
          '<a class="btn btn-aura" href="print.html">Browse printing &rarr;</a>' +
        '</div>';
      C.badge();
      return;
    }

    var lines = list.map(function(it,i){
      return '<div class="line">' +
        '<div>' +
          '<h3>' + C.esc(it.name || it.slug) + '</h3>' +
          '<div class="spec">' + C.esc(C.specLine(it)) + '</div>' +
          '<div class="qty">Quantity: <b>' + Number(it.qty).toLocaleString('en-AU') + '</b></div>' +
          '<button class="rm" data-i="' + i + '">Remove</button>' +
        '</div>' +
        '<div class="amt">' + C.money(it.price_cents) + '<small>inc GST</small></div>' +
      '</div>';
    }).join('');

    var total = C.total();
    var ex = Math.round(total / 1.1);

    wrap.innerHTML =
      '<div class="cartgrid">' +
        '<div class="panel">' +
          '<h2 style="font-size:22px;margin-bottom:4px">' + list.length + ' item' + (list.length===1?'':'s') + '</h2>' +
          '<p style="color:#6f6960;font-size:14px;margin-bottom:6px">To change a quantity or an option, remove the line and configure it again.</p>' +
          lines +
        '</div>' +
        '<div class="panel">' +
          '<div class="sumrow"><span>Subtotal (ex GST)</span><b>' + C.money(ex) + '</b></div>' +
          '<div class="sumrow"><span>GST</span><b>' + C.money(total - ex) + '</b></div>' +
          '<div class="sumrow"><span>Delivery</span><b>Included</b></div>' +
          '<div class="sumrow tot"><span>Total</span><b>' + C.money(total) + '</b></div>' +
          '<div class="freebadge">&#10003; Free delivery Australia wide</div>' +
          '<a class="btn btn-aura" href="checkout.html" style="width:100%;text-align:center;margin-top:20px">Checkout &rarr;</a>' +
          '<a class="btn btn-ghost" href="print.html" style="width:100%;text-align:center;margin-top:10px">Keep shopping</a>' +
          '<div class="trust">' +
            '<div><span>&#10003;</span><span>We check your artwork before anything is printed</span></div>' +
            '<div><span>&#10003;</span><span>Card, PayID or bank transfer</span></div>' +
            '<div><span>&#10003;</span><span>Prices are confirmed by our server at checkout</span></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    wrap.querySelectorAll('.rm').forEach(function(b){
      b.addEventListener('click', function(){ C.removeAt(+b.dataset.i); render(); });
    });
    C.badge();
  }

  render();
})();
</script>
<script src="assets/aura.js?v=20260831c"></script>
</body>
</html>
